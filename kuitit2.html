<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Kuitit</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f9f6f0;color:#1a1a1a}
.header{background:#2C2416;padding:12px 16px;border-bottom:3px solid #C9A560}
.header h1{color:#C9A560;font-size:13px;letter-spacing:0.5px}
.header p{color:#aaa;font-size:10px;letter-spacing:1px;margin-top:2px}
.container{padding:16px;max-width:520px;margin:0 auto}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 6px rgba(0,0,0,0.07)}
.btn{width:100%;background:#2C2416;color:#C9A560;border:none;border-radius:10px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:8px;font-family:Arial,sans-serif}
.btn-outline{background:transparent;border:1px solid #2C2416;color:#2C2416}
.gold-label{font-size:10px;color:#b8922a;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px}
.month-row{display:flex;gap:8px;margin-bottom:12px}
.mbtn{flex:1;padding:8px;border:1px solid #e0d8c8;border-radius:8px;background:#fff;font-size:13px;cursor:pointer;font-family:Arial,sans-serif}
.mbtn.active{background:#2C2416;color:#C9A560;border-color:#2C2416;font-weight:700}
.total{background:#2C2416;color:#fff;border-radius:10px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.total span{font-size:13px;color:#ccc}
.total strong{font-size:18px;color:#C9A560}
.upload-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.upload-btn{border:2px dashed #C9A560;border-radius:10px;padding:20px;text-align:center;cursor:pointer;background:#fdf6e8}
.upload-btn div{font-size:28px;margin-bottom:4px}
.upload-btn span{font-size:13px;font-weight:600;color:#2C2416}
.kuitti{border:1px solid #e0d8c8;border-radius:10px;padding:12px;margin-bottom:10px;position:relative;background:#faf8f4}
.kuitti img{width:100%;border-radius:8px;margin-bottom:8px;max-height:180px;object-fit:cover;cursor:pointer}
.kuitti h3{font-size:14px;margin-bottom:2px}
.kuitti p{font-size:12px;color:#777}
.kuitti .sum{font-size:14px;font-weight:700;color:#2C2416}
.kuitti input{display:block;width:100%;border:1px solid #e0d8c8;border-radius:6px;padding:6px 8px;font-size:13px;font-family:Arial,sans-serif;margin-bottom:6px;background:#fff;color:#1a1a1a}
.kuitti input.edit-kauppa{font-weight:700;font-size:14px}
.kuitti input.edit-summa{font-weight:700;color:#2C2416;max-width:140px}
.del{position:absolute;top:10px;right:10px;background:#fee;border:1px solid #fcc;border-radius:6px;padding:3px 9px;color:#c00;cursor:pointer;font-size:13px;font-family:Arial,sans-serif}
.status{text-align:center;padding:12px;color:#888;font-size:13px}
.spinner{display:inline-block;width:20px;height:20px;border:3px solid #e0d8c8;border-top-color:#C9A560;border-radius:50%;animation:spin 0.8s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:999;align-items:center;justify-content:center}
.modal.open{display:flex}
.modal img{max-width:95%;max-height:95%;border-radius:8px}
.modal-x{position:absolute;top:16px;right:16px;color:#fff;font-size:30px;cursor:pointer}
</style>
</head>
<body>

<div class="header">
  <h1>RAKENNUSTYÖ KAIVOLA & RAVATTINEN AY</h1>
  <p>KUITTIEN HALLINTA</p>
</div>

<div class="modal" id="modal" onclick="this.classList.remove('open')">
  <div class="modal-x">×</div>
  <img id="modalImg" src=""/>
</div>

<div class="container">

  <div id="loginCard" class="card" style="text-align:center;padding:30px">
    <div style="font-size:48px;margin-bottom:12px">🧾</div>
    <h2 style="color:#2C2416;margin-bottom:8px">Kuittiarkisto</h2>
    <p style="color:#888;font-size:13px;margin-bottom:20px">Kirjaudu Google-tilillä tallentaaksesi kuitit Driveen</p>
    <button class="btn" id="loginBtn">🔑 Kirjaudu Google-tilillä</button>
  </div>

  <div id="mainCard" style="display:none">
    <div class="month-row" id="monthRow"></div>
    <div class="total"><span id="monthLabel">Syyskuu 2026</span><strong id="totalSum">0,00 €</strong></div>

    <div class="card">
      <div class="gold-label">Lisää kuitti</div>
      <div class="upload-grid">
        <div class="upload-btn" onclick="document.getElementById('cam').click()">
          <div>📷</div><span>Kamera</span>
        </div>
        <div class="upload-btn" onclick="document.getElementById('gal').click()">
          <div>🖼️</div><span>Galleria</span>
        </div>
      </div>
      <input id="cam" type="file" accept="image/*" capture="environment" style="display:none" onchange="lisaaKuitti(event)"/>
      <input id="gal" type="file" accept="image/*" style="display:none" onchange="lisaaKuitti(event)"/>
      <div id="uploadStatus"></div>
    </div>

    <div class="card">
      <div class="gold-label">Kuitit tällä kuulla</div>
      <div id="lista"><div class="status">Ei kuitteja</div></div>
    </div>

    <button class="btn" onclick="lataaPDF()">⬇️ Lataa kuukausiraportti</button>
    <button class="btn btn-outline" onclick="vaihdaAvain()">🔑 Vaihda API-avain</button>
    <button class="btn btn-outline" onclick="kirjauduUlos()">Kirjaudu ulos</button>
  </div>

</div>

<script>
const CLIENT_ID = '90611464108-hbis8vs6dconri9ef7njsjma1b9i5udm.apps.googleusercontent.com';
const SCOPE = 'https://www.googleapis.com/auth/drive.file';
const MONTHS = ['Tammikuu','Helmikuu','Maaliskuu','Huhtikuu','Toukokuu','Kesäkuu','Heinäkuu','Elokuu','Syyskuu','Lokakuu','Marraskuu','Joulukuu'];

let token = null;
let kuitit = [];
let kuukausi = new Date().getMonth();
let vuosi = new Date().getFullYear();
let tokenClient = null;

function fmt(n){ return Number(n).toLocaleString('fi-FI',{minimumFractionDigits:2,maximumFractionDigits:2})+' €'; }

function lataaTallennetut(){
  try{
    const raw = localStorage.getItem('kuitit_data');
    if(raw) kuitit = JSON.parse(raw);
  }catch(e){ console.error('Ei voitu ladata tallennettuja kuitteja', e); }
}

function tallennaLokaalisti(){
  try{
    localStorage.setItem('kuitit_data', JSON.stringify(kuitit));
  }catch(e){
    console.error('Tallennus paikallisesti epäonnistui (tila loppui?)', e);
    alert('Huom: kuitteja ei voitu tallentaa puhelimen muistiin (tila täynnä). Ne ovat silti Google Drivessa.');
  }
}

// Ladataan Google-kirjasto dynaamisesti
const s = document.createElement('script');
s.src = 'https://accounts.google.com/gsi/client';
s.onload = function(){
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPE,
    callback: (r) => { if(r.access_token){ token=r.access_token; kirjauduttu(); } }
  });
  document.getElementById('loginBtn').onclick = () => tokenClient.requestAccessToken();
};
s.onerror = function(){
  document.getElementById('loginBtn').textContent = '⚠️ Päivitä sivu';
};
document.head.appendChild(s);

function kirjauduttu(){
  // Tarkista API-avain
  if(!localStorage.getItem('sk')){
    const key = prompt('Anna Anthropic API-avain (sk-ant-...):');
    if(key) localStorage.setItem('sk', key.trim());
  }
  document.getElementById('loginCard').style.display = 'none';
  document.getElementById('mainCard').style.display = 'block';
  lataaTallennetut();
  rakennaNapit();
  paivita();
}

function vaihdaAvain(){
  const key = prompt('Anna uusi Anthropic API-avain (sk-ant-...):', localStorage.getItem('sk')||'');
  if(key) { localStorage.setItem('sk', key.trim()); alert('API-avain päivitetty.'); }
}

function kirjauduUlos(){
  token=null; kuitit=[];
  document.getElementById('mainCard').style.display='none';
  document.getElementById('loginCard').style.display='block';
}

function rakennaNapit(){
  const c = document.getElementById('monthRow');
  c.innerHTML='';
  const now = new Date();
  for(let i=2;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const m=d.getMonth(), y=d.getFullYear();
    const b = document.createElement('button');
    b.className='mbtn'+(m===kuukausi&&y===vuosi?' active':'');
    b.textContent=MONTHS[m].slice(0,3);
    b.onclick=()=>{ kuukausi=m; vuosi=y; rakennaNapit(); paivita(); };
    c.appendChild(b);
  }
}

function paivita(){
  const lista=kuitit.filter(k=>k.m===kuukausi&&k.y===vuosi);
  const sum=lista.reduce((s,k)=>s+(parseFloat(k.summa)||0),0);
  document.getElementById('totalSum').textContent=fmt(sum);
  document.getElementById('monthLabel').textContent=MONTHS[kuukausi]+' '+vuosi;
  const el=document.getElementById('lista');
  if(!lista.length){ el.innerHTML='<div class="status">Ei kuitteja tällä kuulla</div>'; return; }
  el.innerHTML=lista.map((k,i)=>`
    <div class="kuitti">
      <img src="data:${k.type};base64,${k.b64}" onclick="document.getElementById('modalImg').src=this.src;document.getElementById('modal').classList.add('open')"/>
      <input class="edit-kauppa" data-i="${i}" value="${(k.kauppa||'').replace(/"/g,'&quot;')}" placeholder="Kauppa" onchange="muokkaa(${i},'kauppa',this.value)"/>
      <input class="edit-pvm" data-i="${i}" value="${(k.pvm||'').replace(/"/g,'&quot;')}" placeholder="pp.kk.vvvv" onchange="muokkaa(${i},'pvm',this.value)"/>
      <input class="edit-summa" data-i="${i}" type="number" step="0.01" value="${k.summa||''}" placeholder="0.00" onchange="muokkaa(${i},'summa',this.value)"/>
      <button class="del" onclick="poista(${i})">×</button>
    </div>`).join('');
}

function muokkaa(idx, kentta, arvo){
  const lista=kuitit.filter(k=>k.m===kuukausi&&k.y===vuosi);
  const k=lista[idx];
  if(!k) return;
  k[kentta] = kentta==='summa' ? (parseFloat(arvo)||0) : arvo;
  tallennaLokaalisti();
  paivita();
}

function poista(idx){
  const lista=kuitit.filter(k=>k.m===kuukausi&&k.y===vuosi);
  const k=lista[idx];
  if(confirm('Poista: '+(k.kauppa||'kuitti')+'?')){ kuitit.splice(kuitit.indexOf(k),1); tallennaLokaalisti(); paivita(); }
}

async function lisaaKuitti(e){
  const file=e.target.files[0];
  if(!file) return;
  e.target.value='';
  const st=document.getElementById('uploadStatus');
  st.innerHTML='<div class="status"><span class="spinner"></span>AI lukee kuittia...</div>';
  try{
    const b64=await toB64(file);
    const apiKey=localStorage.getItem('sk');
    const ai=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1024,messages:[{role:'user',content:[
        {type:'image',source:{type:'base64',media_type:file.type,data:b64}},
        {type:'text',text:'Lue tästä kuitista: kaupan/yrityksen nimi, kuitin KOKONAISLOPPUSUMMA euroina (etsi teksti kuten "Yhteensä", "Summa", "Maksettu"), ostopäivämäärä muodossa pp.kk.vvvv, ja hyvin lyhyt (max 5 sanaa) kuvaus ostoksesta. Vastaa PELKÄLLÄ JSON-oliolla, ei muuta tekstiä ennen tai jälkeen, ei selityksiä: {"kauppa":"","summa":0.00,"pvm":"","kuvaus":""}. Jos jokin tieto ei löydy kuitista, käytä tyhjää merkkijonoa "" (summalle 0).'}
      ]}]})
    });
    const data=await ai.json();
    if(data.error) throw new Error('AI-virhe: '+(data.error.message||JSON.stringify(data.error)));
    let info={};
    const raw=(data.content?.[0]?.text||'{}').replace(/```json|```/g,'').trim();
    try{ info=JSON.parse(raw); }
    catch(parseErr){
      const match=raw.match(/\{[\s\S]*\}/);
      if(match){ try{ info=JSON.parse(match[0]); }catch{} }
      if(!info.kauppa && !info.summa) console.warn('AI-vastausta ei voitu jäsentää:', raw);
    }
    st.innerHTML='<div class="status"><span class="spinner"></span>Tallennetaan Driveen...</div>';
    await tallennaDrive(file,info);
    kuitit.push({...info,b64,type:file.type,m:kuukausi,y:vuosi});
    tallennaLokaalisti();
    paivita();
    st.innerHTML='<div class="status" style="color:green">✓ Tallennettu!</div>';
    setTimeout(()=>st.innerHTML='',3000);
  }catch(err){
    st.innerHTML=`<div class="status" style="color:red">Virhe: ${err.message}</div>`;
  }
}

async function toB64(file){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result.split(',')[1]); r.onerror=rej; r.readAsDataURL(file); });
}

async function tallennaDrive(file,info){
  if(!token) return;
  const folder=await getFolder('Kuitit '+vuosi+'/'+MONTHS[kuukausi]);
  const name=(info.pvm||'kuitti')+'_'+(info.kauppa||'kuitti')+'.'+file.name.split('.').pop();
  const form=new FormData();
  form.append('metadata',new Blob([JSON.stringify({name,parents:[folder]})],{type:'application/json'}));
  form.append('file',file);
  await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{
    method:'POST',headers:{'Authorization':'Bearer '+token},body:form
  });
}

async function getFolder(path){
  let parent='root';
  for(const part of path.split('/')){
    const q=encodeURIComponent(`name='${part}' and mimeType='application/vnd.google-apps.folder' and '${parent}' in parents and trashed=false`);
    const r=await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)`,{headers:{'Authorization':'Bearer '+token}});
    const d=await r.json();
    if(d.files?.length){ parent=d.files[0].id; }
    else{
      const cr=await fetch('https://www.googleapis.com/drive/v3/files',{method:'POST',headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({name:part,mimeType:'application/vnd.google-apps.folder',parents:[parent]})});
      parent=(await cr.json()).id;
    }
  }
  return parent;
}

function lataaPDF(){
  const lista=kuitit.filter(k=>k.m===kuukausi&&k.y===vuosi);
  if(!lista.length){alert('Ei kuitteja');return;}
  const sum=lista.reduce((s,k)=>s+(parseFloat(k.summa)||0),0);
  const html=`<!DOCTYPE html><html><head><meta charset="UTF-8"/><style>
    body{font-family:Arial,sans-serif;margin:15mm;color:#1a1a1a}
    h1{color:#2C2416;font-size:20pt;margin-bottom:2mm}
    h2{color:#888;font-size:10pt;font-weight:400;margin-bottom:8mm}
    .k{page-break-inside:avoid;margin-bottom:10mm;border:1px solid #ddd;padding:6mm;border-radius:4px}
    .k img{max-width:100%;max-height:100mm;object-fit:contain;display:block;margin-bottom:3mm}
    .k h3{font-size:12pt;margin-bottom:1mm}
    .k p{font-size:9pt;color:#777}
    .k .s{font-size:12pt;font-weight:700}
    .tot{background:#2C2416;color:#C9A560;padding:6mm;border-radius:4px;display:flex;justify-content:space-between;font-size:14pt;font-weight:700;margin-top:8mm}
    @media print{*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}}
  </style></head><body>
  <h1>Kuittiraportti</h1>
  <h2>Rakennustyö Kaivola & Ravattinen Ay — ${MONTHS[kuukausi]} ${vuosi}</h2>
  ${lista.map(k=>`<div class="k"><img src="data:${k.type};base64,${k.b64}"/><h3>${k.kauppa||'Tuntematon'}</h3><p>${k.pvm||''} ${k.kuvaus?'· '+k.kuvaus:''}</p><div class="s">${fmt(k.summa||0)}</div></div>`).join('')}
  <div class="tot"><span>YHTEENSÄ ${MONTHS[kuukausi]} ${vuosi}</span><span>${fmt(sum)}</span></div>
  <script>window.onload=()=>window.print()<\/script></body></html>`;
  const w=window.open('','_blank');
  if(w){w.document.write(html);w.document.close();}
  else alert('Salli ponnahdusikkunat');
}
</script>
</body>
</html>
